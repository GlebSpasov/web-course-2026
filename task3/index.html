<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список задач (To-Do List)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="todo-app">
    <h1 class="todo-app__title">Список задач</h1>

    <form id="todo-form" class="todo-form">
        <input type="text" id="todo-input" placeholder="Введите текст задачи..." autocomplete="off">
        <button type="submit" id="add-btn" class="btn btn--primary">Добавить</button>
    </form>
    <div id="error-message" class="error-message"></div>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="completed">Завершённые</button>
    </div>

    <div class="counter">
        <span>Осталось: <strong id="active-count">0</strong></span>
        <span>Выполнено: <strong id="completed-count">0</strong></span>
    </div>

    <ul id="todo-list" class="todo-list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
